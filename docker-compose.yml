version: '3.8'

services:
  appserver:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Mounts the application code into the container for development
      - ./:/app
      # Use a named volume for node_modules to persist them and avoid overwriting by the host mount
      - app_node_modules:/app/node_modules
    depends_on:
      - mongo
      - chroma
    env_file:
      - path: ./docker.env
    restart: unless-stopped

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma # Default path for persistent storage in chromadb
    # ChromaDB can be configured further with environment variables or a config file
    # For example, to ensure persistence is enabled (though it's often default):
    # environment:
    #   - CHROMA_SERVER_PERSISTENCE_IMPL=local
    #   - CHROMA_SERVER_PERSIST_PATH=/chroma/chroma
    restart: unless-stopped

volumes:
  mongo-data:
  chroma-data:
  app_node_modules: 